<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create your Shopping App account</title>
    <link rel="stylesheet" href="css/registration.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
<main class="card">
    <h1>Create your account</h1>

    <section id="registration" aria-labelledby="registration-heading">
        <p id="registration-heading" class="hint">Fields marked <span class="required-marker" aria-hidden="true">*</span> are required.</p>

        <div id="form-error" class="banner banner-error" role="alert" hidden></div>

        <form id="registration-form" novalidate>
            <div class="field">
                <label for="email">Email <span class="required-marker" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
                <input id="email" name="email" type="email" autocomplete="email" inputmode="email"
                       required aria-required="true" aria-describedby="email-error" maxlength="320">
                <p id="email-error" class="field-error" hidden></p>
            </div>

            <div class="field">
                <label for="mobile">Mobile number <span class="required-marker" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
                <input id="mobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel"
                       required aria-required="true" aria-describedby="mobile-error" maxlength="32">
                <p id="mobile-error" class="field-error" hidden></p>
            </div>

            <button id="submit" type="submit">Create account</button>
        </form>
    </section>

    <section id="registration-success" class="banner banner-success" role="status" tabindex="-1" hidden>
        <h2>Your account has been created</h2>
        <p>Welcome to the Shopping App. Your account was created successfully.</p>
    </section>
</main>
</body>
</html>
